plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cozytv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.cozytv'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
